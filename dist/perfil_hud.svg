<svg width="888" height="814" viewBox="0 0 888 814" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#02050A"/><stop offset="50%" stop-color="#051021"/><stop offset="100%" stop-color="#020611"/>
  </linearGradient>
  <linearGradient id="pg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="rgba(11,25,44,0.92)"/><stop offset="100%" stop-color="rgba(4,10,20,0.92)"/>
  </linearGradient>
  <filter id="gG"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
  <filter id="gB"><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
  <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
    <path d="M50 0L0 0 0 50" fill="none" stroke="rgba(0,229,255,0.04)" stroke-width="1"/>
    <circle cx="50" cy="50" r="1" fill="rgba(0,229,255,0.12)"/>
  </pattern>
</defs>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&amp;family=Orbitron:wght@500;700;900&amp;display=swap');
  .t1{font:800 26px 'Orbitron',sans-serif;fill:#E0E6ED;letter-spacing:2px}
  .t2{font:700 14px 'Fira Code',monospace;fill:#00E5FF;letter-spacing:1px}
  .t3{font:600 13px 'Fira Code',monospace;fill:#5B7C99;letter-spacing:1px}
  .t4{font:700 22px 'Orbitron',sans-serif;fill:#00E5FF}
  .t5{font:400 13px 'Fira Code',monospace;fill:#E0E6ED}
  .t6{font:400 11px 'Fira Code',monospace;fill:rgba(0,255,65,0.45)}
  .blink{animation:bk 1s step-end infinite;fill:#00FF41;font-weight:700}
  @keyframes bk{50%{opacity:0}}
  @keyframes fadeUp{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
  .anim{animation:fadeUp .5s ease-out forwards}
  
        @keyframes fb0 { 0%{width:0;opacity:0} 100%{width:297px;opacity:1} }
        .b0{animation:fb0 1.2s cubic-bezier(.1,.8,.2,1) forwards;animation-delay:0.4s;width:0}
        
        @keyframes fb1 { 0%{width:0;opacity:0} 100%{width:171px;opacity:1} }
        .b1{animation:fb1 1.2s cubic-bezier(.1,.8,.2,1) forwards;animation-delay:0.55s;width:0}
        
        @keyframes fb2 { 0%{width:0;opacity:0} 100%{width:105px;opacity:1} }
        .b2{animation:fb2 1.2s cubic-bezier(.1,.8,.2,1) forwards;animation-delay:0.7s;width:0}
        
        @keyframes fb3 { 0%{width:0;opacity:0} 100%{width:33px;opacity:1} }
        .b3{animation:fb3 1.2s cubic-bezier(.1,.8,.2,1) forwards;animation-delay:0.85s;width:0}
        
        @keyframes fb4 { 0%{width:0;opacity:0} 100%{width:13px;opacity:1} }
        .b4{animation:fb4 1.2s cubic-bezier(.1,.8,.2,1) forwards;animation-delay:1.0s;width:0}
        
        @keyframes fb5 { 0%{width:0;opacity:0} 100%{width:13px;opacity:1} }
        .b5{animation:fb5 1.2s cubic-bezier(.1,.8,.2,1) forwards;animation-delay:1.15s;width:0}
        
</style>

<!-- Background -->
<rect width="888" height="814" rx="12" fill="url(#bg)" stroke="#00E5FF" stroke-width="1"/>
