name: Update Epic SVG Profile

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests

      - name: Generate the Epic SVG
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/generar_perfil.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/perfil_hud.svg dist/about_me.svg
          git diff --staged --quiet || git commit -m "🚀 Auto-update epic profile stats"
          git push
