name: Update Epic SVG Profile

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate the Epic SVG
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }} # Token to fetch private stats
        run: python scripts/generar_perfil.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/perfil_hud.svg
          git commit -m "🚀 Auto-update epic profile stats" || echo "No changes to commit"
          git push
